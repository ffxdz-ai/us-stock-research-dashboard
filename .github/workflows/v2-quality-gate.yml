name: V2 model quality gate

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "config/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run V2 model tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate JSON configuration and schema files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [*Path("config").glob("*.json"), *Path("schemas").glob("*.json")]:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY
